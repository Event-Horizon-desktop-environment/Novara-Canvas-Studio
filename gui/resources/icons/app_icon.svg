<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 400 400" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Video editor icon, VHS tape with film strip timeline</title>
  <desc>A complete semi-rounded coral-to-red square icon. At the top, two dark glass reel windows with light hubs flank a light label with red, green and blue stripes. A dark film strip fills the entire lower part of the tile down to the bottom edge, with light sprocket holes, five white frames fading out toward the sides, and a white playhead through the middle frame.</desc>

  <defs>
    <clipPath id="tile">
      <rect x="0" y="0" width="400" height="400" rx="60"/>
    </clipPath>
    <linearGradient id="gBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9a62"/>
      <stop offset="1" stop-color="#e2403b"/>
    </linearGradient>
    <linearGradient id="gSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="gGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a161a"/>
      <stop offset="1" stop-color="#220a0d"/>
    </linearGradient>
    <linearGradient id="gLabel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffe6d8"/>
    </linearGradient>
    <linearGradient id="gStrip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34100f"/>
      <stop offset="1" stop-color="#1c0809"/>
    </linearGradient>
    <linearGradient id="gStripShadow" gradientUnits="userSpaceOnUse" x1="0" y1="196" x2="0" y2="214">
      <stop offset="0" stop-color="#3a0a0c" stop-opacity="0"/>
      <stop offset="1" stop-color="#3a0a0c" stop-opacity="0.35"/>
    </linearGradient>
    <g id="hub">
      <circle r="26" fill="#fff7f2"/>
      <circle r="10" fill="#3a1014"/>
      <rect x="-2.2" y="-24" width="4.4" height="9" fill="#3a1014"/>
      <rect x="-2.2" y="-24" width="4.4" height="9" fill="#3a1014" transform="rotate(120)"/>
      <rect x="-2.2" y="-24" width="4.4" height="9" fill="#3a1014" transform="rotate(240)"/>
    </g>
  </defs>

  <g clip-path="url(#tile)">
    <!-- Tile and sheen -->
    <rect x="0" y="0" width="400" height="400" fill="url(#gBody)"/>
    <rect x="0" y="0" width="400" height="170" fill="url(#gSheen)"/>

    <!-- VHS reel windows -->
    <circle cx="92" cy="122" r="48" fill="url(#gGlass)" opacity="0.85"/>
    <circle cx="308" cy="122" r="48" fill="url(#gGlass)" opacity="0.85"/>
    <use href="#hub" x="92" y="122"/>
    <use href="#hub" x="308" y="122"/>

    <!-- Label with RGB stripes -->
    <rect x="146" y="76" width="108" height="92" rx="10" fill="url(#gLabel)"/>
    <rect x="158" y="90" width="84" height="8" rx="4" fill="#ff2d2d"/>
    <rect x="158" y="103" width="84" height="8" rx="4" fill="#22d15a"/>
    <rect x="158" y="116" width="84" height="8" rx="4" fill="#2d6bff"/>

    <!-- Film strip filling the whole bottom -->
    <rect x="0" y="196" width="400" height="18" fill="url(#gStripShadow)"/>
    <rect x="-10" y="214" width="420" height="200" fill="url(#gStrip)"/>
    <line x1="-4" y1="241" x2="410" y2="241" stroke="#ffe3d6" stroke-width="10" stroke-dasharray="14 12" opacity="0.85"/>
    <line x1="-4" y1="373" x2="410" y2="373" stroke="#ffe3d6" stroke-width="10" stroke-dasharray="14 12" opacity="0.85"/>
    <rect x="-74" y="269" width="100" height="76" rx="9" fill="#ffffff" opacity="0.3"/>
    <rect x="38" y="269" width="100" height="76" rx="9" fill="#ffffff" opacity="0.65"/>
    <rect x="150" y="269" width="100" height="76" rx="9" fill="#ffffff"/>
    <rect x="262" y="269" width="100" height="76" rx="9" fill="#ffffff" opacity="0.65"/>
    <rect x="374" y="269" width="100" height="76" rx="9" fill="#ffffff" opacity="0.3"/>

    <!-- Playhead -->
    <line x1="200" y1="196" x2="200" y2="414" stroke="#220a0d" stroke-width="8" stroke-linecap="round"/>
    <line x1="200" y1="196" x2="200" y2="414" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <path d="M188,182 H212 L200,200 Z" fill="#ffffff" stroke="#220a0d" stroke-width="3" stroke-linejoin="round" paint-order="stroke"/>
  </g>

  <!-- Tile rim -->
  <rect x="1.5" y="1.5" width="397" height="397" rx="58.5" fill="none" stroke="url(#gRim)" stroke-width="3"/>
</svg>
